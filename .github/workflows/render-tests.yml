name: Render regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  render-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/render-loop.test.cjs
